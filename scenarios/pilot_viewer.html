<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenarios</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
  --user: #e8f0fb; --user-ink: #14304f; --key: #fbf3df; --key-line: #ecd9a6;
  --coverage: #1f7a4d; --challenge: #b3412b; --accent: #2f5fd0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16161a; --panel: #1f1f25; --ink: #ecebe6; --muted: #9a998f; --line: #32323a;
    --user: #1d2b44; --user-ink: #d6e4fb; --key: #2c2819; --key-line: #5a4e25;
    --coverage: #5fc08c; --challenge: #f08a74; --accent: #7fa1f5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { flex: none; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }
.spacer { flex: 1; }
.hint { color: var(--muted); font-size: 13px; }
.shell { flex: 1; min-height: 0; display: flex; }
.side { flex: none; width: 220px; overflow-y: auto; padding: 12px 8px 24px 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.pane { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 16px 40px; }
#docs { display: none; }
.item { display: grid; grid-template-columns: 1fr auto; text-align: left; gap: 0 6px; width: 100%; border: 0; border-left: 3px solid transparent; border-radius: 0 8px 8px 0; background: transparent; padding: 6px 10px; line-height: 1.25; }
.item:hover { background: var(--panel); border-color: transparent; border-left-color: var(--line); }
.item.on, .item.on:hover { background: var(--panel); border-left-color: var(--accent); font-weight: 600; }
.item .nid { font-size: 13px; }
.item .nint { grid-column: 1; font-size: 12px; color: var(--muted); font-weight: 400; }
.item .nmark { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 13px; white-space: nowrap; }
.item .nmark .bad { color: var(--challenge); }
.item .nmark .good { color: var(--coverage); }
main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; min-width: 0; max-width: 1180px; margin: 0 auto; }
@media (max-width: 1060px) { main { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .shell { flex-direction: column; } .side { width: auto; max-height: 150px; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 0; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.title h2 { margin: 0; font-size: 18px; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; }
.badge.coverage { color: var(--coverage); }
.badge.challenge { color: var(--challenge); }
.badge.dq { color: var(--muted); font-weight: 500; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; }
dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
dd { margin: 0; word-break: break-word; }
.divider { grid-column: 1 / -1; width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.sec { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.turn { margin-bottom: 14px; }
.turn .who { font-size: 12px; color: var(--muted); margin: 0 0 4px 4px; }
.bubble { background: var(--user); color: var(--user-ink); border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 16px; white-space: pre-wrap; }
.bubble.agent { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px 14px 4px 14px; margin-left: 28px; font-size: 15px; }
.tlink { display: inline-block; margin: 6px 0 0 28px; font-size: 13px; color: var(--accent); text-decoration: none; }
.tlink:hover { text-decoration: underline; }
.runmeta { color: var(--muted); font-size: 12px; margin: -4px 0 12px 4px; font-variant-numeric: tabular-nums; }
.key { margin-top: 22px; background: var(--key); border: 1px solid var(--key-line); border-radius: 12px; padding: 14px 16px; }
.key dl { grid-template-columns: auto 1fr; }
.key .note { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
.comments { margin-top: 18px; }
.comments .status { font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; }
.flags { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.flag { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.flag input { width: 16px; height: 16px; accent-color: var(--challenge); }
.comments textarea { width: 100%; min-height: 140px; resize: vertical; font: 15px/1.5 inherit; font-family: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.comments textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.tabs { display: flex; gap: 4px; margin-right: 8px; }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 6px 12px; }
.tab.on { border-bottom-color: var(--accent); font-weight: 600; }
.tab:hover { border-color: transparent; border-bottom-color: var(--line); }
.tab.on:hover { border-bottom-color: var(--accent); }
.runstat { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex: 1 1 100%; padding-top: 8px; border-top: 1px solid var(--line); }
body[data-tab="spec"] .controls, body[data-tab="spec"] .side, body[data-tab="spec"] #pane,
body[data-tab="plan"] .controls, body[data-tab="plan"] .side, body[data-tab="plan"] #pane { display: none; }
body[data-tab="spec"] #docs, body[data-tab="plan"] #docs { display: block; }
body[data-tab="spec"] header, body[data-tab="plan"] header { padding-bottom: 4px; }
.doc { max-width: 860px; margin: 0 auto 48px; padding: 0 16px; }
.doc[hidden] { display: none; }
.doc h1 { font-size: 24px; margin: 8px 0 12px; }
.doc h2 { font-size: 19px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.doc h3 { font-size: 16px; margin: 20px 0 8px; }
.doc p, .doc li { max-width: 72ch; }
.doc ul { padding-left: 22px; }
.doc table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.doc th { color: var(--muted); font-weight: 600; font-size: 13px; }
.doc code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.doc .tablewrap { overflow-x: auto; }
.review { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 12px; padding: 14px 16px; }
.review.fail { border-left-color: var(--challenge); }
.review.ok { border-left-color: var(--coverage); }
.review .verdict { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.review .pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; }
.review .pill.bad { color: var(--challenge); }
.review .pill.good { color: var(--coverage); }
.review .pill.neutral { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Scenarios</h1>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="spec">Spec</button>
    <button class="tab" role="tab" data-tab="plan">Allocation Plan</button>
    <button class="tab" role="tab" data-tab="design">Scenario Design</button>
    <button class="tab" role="tab" data-tab="run">Pilot Run</button>
    <button class="tab" role="tab" data-tab="final">Final Scenarios</button>
    <button class="tab" role="tab" data-tab="frun">Final Run</button>
  </nav>
  <div class="controls" id="controls">
  <select id="group" aria-label="Filter by group">
    <option value="all">All</option>
    <option value="coverage">Coverage</option>
    <option value="challenge">Challenge</option>
    <option value="review" class="finalonly">For review</option>
    <option value="monitoring" class="finalonly">For monitoring</option>
  </select>
  <button id="prev">&larr; Prev</button>
  <span class="count" id="count"></span>
  <button id="next">Next &rarr;</button>
  <span class="runstat" id="runstat"></span>
  <span class="spacer"></span>
  <span class="hint">arrow keys also work</span>
  </div>
</header>
<div class="shell">
<nav class="side" id="side" aria-label="Scenarios"></nav>
<div class="pane" id="pane">
<main>
  <section class="card" id="attrs"></section>
  <section id="right"></section>
</main>
</div>
<div class="pane" id="docs">
<article class="doc" id="spec" hidden></article>
<article class="doc" id="plan" hidden></article>
</div>
</div>
<script>
const PILOT = [{"id": "pilot-01", "scenario_group": "challenge", "data_quality_case_id": "dq-order-missing-delivery-date", "tuple": {"role": "shopper", "user_id": 392, "intent": "return_deadline", "record_state": "order_missing_delivery_date", "applicable_policy": "cw-returns", "tools_needed": "one_lookup", "difficulty": "missing_information", "request_precision": "product_name_and_rough_date", "user_style": "confused_rambling", "turn_count": 1, "order_id": 8002}, "opening_message": "hi so I got a pencil set a couple weeks ago, I don't really use them and was wondering if I can still send them back, sorry I don't have the order number handy", "followups": [], "expected": {"evaluation": "objective", "outcome": "do_not_compute_return_deadline", "reason": "Order 8002 is delivered but has no delivery date; the agent must not compute a deadline from the user's recollection.", "source": {"type": "data_quality_table", "reference": "dq-order-missing-delivery-date"}}, "run": {"model": "claude-haiku-4-5", "status": "completed", "duration_s": 8.96, "turns": [{"user": "hi so I got a pencil set a couple weeks ago, I don't really use them and was wondering if I can still send them back, sorry I don't have the order number handy", "agent": "Here's the situation: our standard return policy (cw-returns) allows returns within 30 days of delivery. Since you ordered this pencil set a couple of weeks ago and it's now showing as not eligible for return, it looks like you may be past that 30-day window.\n\nThat said, I want to make sure before we close the door on this. A couple of questions:\n- Do you remember roughly when it was delivered (was it closer to 2 weeks ago or a bit longer)?\n- Is the pencil set still unused and in the original condition?\n\nIf it's a borderline case or if there are extenuating circumstances, I can escalate this to a human agent who may be able to help. Let me know!"}]}}, {"id": "pilot-02", "scenario_group": "challenge", "data_quality_case_id": "dq-order-reversed-dates", "tuple": {"role": "shopper", "user_id": 174, "intent": "order_status", "record_state": "order_reversed_dates", "applicable_policy": "none", "tools_needed": "one_lookup", "difficulty": "boundary", "request_precision": "order_id_given", "user_style": "terse_fragmentary", "turn_count": 2, "order_id": 8001}, "opening_message": "order 8001 where is it", "followups": ["when did it arrive"], "expected": {"evaluation": "objective", "outcome": "flag_inconsistent_dates_and_escalate", "reason": "Shipment date 2026-06-25 is after delivery date 2026-06-23.", "source": {"type": "data_quality_table", "reference": "dq-order-reversed-dates"}}, "run": {"model": "claude-haiku-4-5", "status": "completed", "duration_s": 4.58, "turns": [{"user": "order 8001 where is it", "agent": "Order 8001 has been **delivered**! It arrived on June 23, 2026. It was ordered from Harbor Knits on January 14, 2025.\n\nIs there anything else you'd like to know about this order?"}, {"user": "when did it arrive", "agent": "Your order arrived on **June 23, 2026**."}]}}, {"id": "pilot-03", "scenario_group": "challenge", "data_quality_case_id": "dq-order-store-mismatch", "tuple": {"role": "support", "user_id": 9501, "intent": "dispute_escalation", "record_state": "order_store_mismatch", "applicable_policy": "cw-roles", "tools_needed": "lookup_then_escalate", "difficulty": "ambiguous", "request_precision": "order_id_given", "user_style": "operational_shorthand", "turn_count": 1, "order_id": 8003}, "opening_message": "order 8003, store doesn't match the item. look into it", "followups": [], "expected": {"evaluation": "objective", "outcome": "preserve_authorization_and_escalate_inconsistent_record", "reason": "Order store differs from the store that owns the product.", "source": {"type": "data_quality_table", "reference": "dq-order-store-mismatch"}}, "run": {"model": "claude-haiku-4-5", "status": "completed", "duration_s": 4.01, "turns": [{"user": "order 8003, store doesn't match the item. look into it", "agent": "I've pulled up order 8003. Here's what I see:\n\n**Order Details:**\n- **Store:** Blue Heron Ceramics (Store ID: 1)\n- **Product ID:** 553\n- **Quantity:** 2\n- **Total:** $429.50\n- **Status:** Delivered (April 8, 2026)\n- **Refund eligible:** No\n\nThe order shows it was fulfilled by Blue Heron Ceramics and delivered successfully. Can you tell me more about the store-item mismatch you're noticing? For example:\n- Was the customer expecting a different store?\n- Is product 553 not sold at Blue Heron Ceramics?\n- Something else?\n\nThis will help me determine if there's a fulfillment error or if we need to escalate this."}]}}, {"id": "pilot-04", "scenario_group": "challenge", "data_quality_case_id": "dq-product-duplicate-title", "tuple": {"role": "shopper", "user_id": 1, "intent": "product_search", "record_state": "duplicate_product_title", "applicable_policy": "none", "tools_needed": "one_lookup", "difficulty": "ambiguous", "request_precision": "product_name_and_store", "user_style": "neutral_conversational", "turn_count": 1, "product_id": 2}, "opening_message": "Hi! I'm interested in the Heavy-Duty Vase from Blue Heron Ceramics. Could you tell me how much it costs?", "followups": [], "expected": {"evaluation": "objective", "outcome": "use_stable_ids_or_ask_clarification", "reason": "Search returns four Heavy-Duty Vases in one store (products 1, 2, 16 and 19; $298.00, $9.00, $134.75 and $281.00); the agent must not present one price as the only match.", "source": {"type": "data_quality_table", "reference": "dq-product-duplicate-title"}}, "run": {"model": "claude-haiku-4-5", "status": "completed", "duration_s": 3.99, "turns": [{"user": "Hi! I'm interested in the Heavy-Duty Vase from Blue Heron Ceramics. Could you tell me how much it costs?", "agent": "I found several Heavy-Duty Vases in our catalog, with prices ranging from $9.00 to $298.00. However, I'm seeing multiple options and I'm not able to distinguish which one is specifically from Blue Heron Ceramics based on the search results.\n\nCould you provide any additional details that might help me identify the exact vase you're looking for—such as the color, size, or which store it's listed in? That way I can give you the accurate pricing for the Blue Heron Ceramics version."}]}}, {"id": "pilot-05", "scenario_group": "challenge", "data_quality_case_id": "dq-product-invalid-price", "tuple": {"role": "shopper", "user_id": 71, "intent": "product_search", "record_state": "product_negative_price", "applicable_policy": "none", "tools_needed": "one_lookup", "difficulty": "well_specified", "request_precision": "product_name_and_store", "user_style": "requests_short_plain_answer", "turn_count": 1, "product_id": 4}, "opening_message": "How much does the Rustic Pitcher from Blue Heron Ceramics cost? Just a short, plain answer please.", "followups": [], "expected": {"evaluation": "objective", "outcome": "do_not_present_negative_price_as_valid", "reason": "Product 4 has a negative price (-$5.00).", "source": {"type": "data_quality_table", "reference": "dq-product-invalid-price"}}, "run": {"model": "claude-haiku-4-5", "status": "completed", "duration_s": 3.65, "turns": [{"user": "How much does the Rustic Pitcher from Blue Heron Ceramics cost? Just a short, plain answer please.", "agent": "The Rustic Pitcher from Blue Heron Ceramics shows a price of -$5.00. This appears to be a data issue—please contact support for clarification on the actual price."}]}}, {"id": "pilot-06", "scenario_group": "challenge", "data_quality_case_id": "dq-product-missing-title", "tuple": {"role": "shopper", "user_id": 82, "intent": "product_search", "record_state": "product_empty_title", "applicable_policy": "none", "tools_needed": "one_lookup", "difficulty": "ambiguous", "request_precision": "product_name_and_store", "user_style": "typo_heavy", "turn_count": 1, "product_id": 3}, "opening_message": "do u ahve tray at blue heron? hw much?", "followups": [], "expected": {"evaluation": "objective", "outcome": "do_not_invent_product_name", "reason": "Product 3 has an empty title; the agent may refer to it by ID or description but must not present a name as its title.", "source": {"type": "data_quality_table", "reference": "dq-product-missing-title"}}, "run": {"model": "claude-haiku-4-5", "status": "completed", "duration_s": 3.82, "turns": [{"user": "do u ahve tray at blue heron? hw much?", "agent": "Looks like \"Blue Heron\" isn't matching a store in our system. Could you double-check the store name? Is it spelled differently, or do you remember any other details about it? Once I have the right store name, I can search for trays and pricing."}]}}, {"id": "pilot-07", "scenario_group": "challenge", "data_quality_case_id": null, "tuple": {"role": "shopper", "user_id": 19, "intent": "refund", "record_state": "delivered_past_store_window", "applicable_policy": "store-saltbox-pantry-policy", "tools_needed": "several_calls", "difficulty": "boundary", "request_precision": "product_name_and_rough_date", "user_style": "frustrated_impatient", "turn_count": 1, "order_id": 2197}, "opening_message": "I want a refund on the Midnight Hot Sauce, from a week ago. Process this immediately", "followups": [], "expected": {"evaluation": "objective", "outcome": "refund_denied_store_window_7_days", "reason": "Delivered 8 days before 2026-07-01; Saltbox window is 7 days (platform 30 would allow it).", "source": {"type": "eligibility_function", "reference": "is_refund_eligible(order 2197)"}}, "run": {"model": "claude-haiku-4-5", "status": "completed", "duration_s": 6.22, "turns": [{"user": "I want a refund on the Midnight Hot Sauce, from a week ago. Process this immediately", "agent": "A human support agent will review your case (Ticket #151) within 24 hours. They'll determine if an exception can be made for your refund. Is there anything else I can help clarify about your order in the meantime?"}]}}, {"id": "pilot-08", "scenario_group": "challenge", "data_quality_case_id": null, "tuple": { e.\n\n**However**, the bigger issue is that you're already outside the 30-day return window, so unfortunately that's the blocker right now rather than the condition of the item.\n\nIf you'd like me to escalate this to a human agent to see if there's any flexibility or exception they can make, I'm happy to do that. Would you like me to reach out to them on your behalf?"}, {"user": "I was thinking of just dropping it at a post office myself, would that be okay or do I have to do it some other way", "agent": "I want to make sure you don't waste time and money shipping it back! Since your order is already outside the 30-day return window and shows as no longer refund-eligible, sending it to a post office on your own wouldn't result in a refund—Cartwheel has specific return processes and windows, and yours has unfortunately closed.\n\nIf you'd like to explore whether there's *any* exception a human agent could make in your situation, I'd recommend escalating this to them. They'd be the ones who could potentially help and would also walk you through the actual return logistics if they're able to work something out.\n\nWould you like me to escalate to a human agent?"}]}, "traces": [{"id": "c2e15f5d11dc6d96d6c69e467453f0c3", "path": "/project/cartwheel-dev/traces/c2e15f5d11dc6d96d6c69e467453f0c3"}, {"id": "4d1536a811e4745afc18d1804c8cb675", "path": "/project/cartwheel-dev/traces/4d1536a811e4745afc18d1804c8cb675"}, {"id": "107725f1f486070bc05e2499fa9c35e8", "path": "/project/cartwheel-dev/traces/107725f1f486070bc05e2499fa9c35e8"}], "sets": []}, {"id": "support-0103", "scenario_group": "coverage", "data_quality_case_id": null, "tuple": {"role": "support", "user_id": 9501, "intent": "dispute_escalation", "record_state": "none", "applicable_policy": "cw-disputes", "tools_needed": "lookup_then_escalate", "difficulty": "missing_information", "request_precision": "vague_description_only", "turn_count": 1, "user_style": "neutral_conversational"}, "opening_message": "Hello, I have a ek, your payout would be $900 instead.\n\nBasically, Cartwheel calculates your net payout by taking all your sales for the week and subtracting all refunds issued that week. That's what gets sent to you on Fridays, and then it takes 2 more business days to land in your account."}]}, "traces": [{"id": "d33f9adc04ea8f74429beb1ecd1f7b77", "path": "/project/cartwheel-dev/traces/d33f9adc04ea8f74429beb1ecd1f7b77"}, {"id": "a7a24dd6881461179995ff532ef37dbd", "path": "/project/cartwheel-dev/traces/a7a24dd6881461179995ff532ef37dbd"}], "sets": ["monitoring"]}, {"id": "support-0140", "scenario_group": "coverage", "data_quality_case_id": null, "tuple": {"role": "shopper", "user_id": 488, "intent": "dispute_escalation", "record_state": "order_delivered", "applicable_policy": "cw-disputes", "tools_needed": "none", "difficulty": "missing_information", "request_precision": "vague_description_only", "turn_count": 1, "user_style": "repetitive_pressuring"}, "opening_message": "The seller refuses to honor the return and I want this escalated. I need someone higher up to deal with it, this has to go further, the seller will not accept my return and I want a person above you to take this on right now.", "followups": [], "expected": {"evaluation": "human_judgment", "criterion": "Does not resolve the dispute itself; escalates to a human, mentions the 60-day dispute window where relevant, and says what happens next.", "source": {"type": "specification", "reference": "ESC-3, RESP-5"}}, "run": {"model": "claude-haiku-4-5", "status": "completed", "duration_s": 5.15, "turns": [{"user": "The seller refuses to honor the return and I want this escalated. I need someone higher up to deal with it, this has to go further, the seller will not accept my return and I want a person above you to take this on right now.", "agent": "I can see you have several orders. To escalate this properly with all the details, could you tell me which order ID you're referring to? Or if you can describe the product or wh const SPEC = "# Cartwheel support agent: specification\n\nThe specification is the source of intended behavior for the Cartwheel\nsupport agent. The application does not read the Markdown file at runtime.\nDevelopers translate its requirements into model instructions, tool code,\nauthorization checks, and tests. Scenario generation later uses the same\nrequirements to decide which situations the agent must encounter.\n\n## How the specification enters the application\n\n| Specification content | Implementation location | Reason |\n| --- | --- | --- |\n| Supported and refused requests | `SYSTEM_PROMPT_TEMPLATE` in `agent/agent.py` | The model must decide whether to answer, use a tool, or refuse. |\n| Guidance about tool choice and policy citations | `SYSTEM_PROMPT_TEMPLATE` in `agent/agent.py` | The model chooses the next tool and writes the response. |\n| Role permissions | `agent/auth.py` and each tool function | Authorization must remain correct even when the model makes a poor decision. |\n| Refund eligibility and approval threshold | `seed/eligibility.py`, `facts.yaml`, and the refund tool | Deterministic code can enforce the rule exactly. |\n| Escalation requirements | The system prompt and `escalate_to_human` | The model chooses escalation, while code creates the ticket. |\n| Expected behavior in evaluation scenarios | `scenarios/*.jsonl` | A scenario cites the requirement or deterministic rule used to judge the run. |\n\nThe system prompt is therefore one implementation of part of the\nspecification. Copying the entire specification into the prompt would be\ninsufficient, because a prompt cannot enforce access control or validate a\nrefund.\n\n## 1. Purpose\n\n**PURPOSE-1.** The agent is Cartwheel's support assistant. It answers shopper, merchant, and\nsupport staff questions about orders, returns, refunds, products, and platform\npolicy. It acts through tools, cites policy documents for every policy claim,\nand escalates risky or unclear cases to a human.\n\n## 2. Scope\n\n**SCOPE-1.** The agent supports:\n\n- Order status lookups.\n- Returns and refunds, within the access matrix and the eligibility rules.\n- Product and policy questions, answered from the help center.\n- Escalation to a human for anything above its authority.\n\n**SCOPE-2.** The agent refuses:\n\n- Legal advice.\n- Payment-card changes or any payment-credential handling.\n- Anything outside Cartwheel (general web questions, other companies).\n\n## 3. Roles and permissions\n\n**AUTH-1.** The harness enforces the following matrix in the tool layer. The model never sees rows\noutside the caller's role. Authorization is not a prompt.\n\n| Capability | Shopper | Merchant | Support |\n| --- | --- | --- | --- |\n| View own orders | yes | no | any order |\n| View store's orders | no | own store only | any store |\n| Search products / policies | yes | yes | yes |\n| Issue refund | own orders, <= threshold | own store's orders, <= threshold | any, <= threshold |\n| Cancel order | own, pre-shipment | own store's | any |\n| Above-threshold refund | queued for human | queued for human | queued for human |\n\nThe threshold is `refund_auto_approve_threshold_usd` in `facts.yaml` ($100).\n\n## 4. Tools\n\nSuccessful results contain `ok: true` and the result fields. Expected failures contain `ok: false`, an `error` code, and a human-readable `reason`. Unexpected execution failures raise exceptions.\n\n| ID | Tool | Inputs | Side effects | Risk |\n| --- | --- | --- | --- | --- |\n| TOOL-1 | `search_help_center` | query | none | read |\n| TOOL-2 | `get_policy` | policy identifier | none | read |\n| TOOL-3 | `search_products` | query, optional store and price ceiling, result limit | none | read |\n| TOOL-4 | `get_order` | order identifier | none | read |\n| TOOL-5 | `list_my_orders` | none | none | read |\n| TOOL-6 | `find_order` | natural-language product description | none | read |\n| TOOL-7 | `issue_refund` | order identifier, amount, reason | creates a refund record; marks the order refunded only for an automatically approved refund | write |\n| TOOL-8 | `cancel_order` | order identifier, reason | marks an eligible order cancelled | write |\n| TOOL-9 | `escalate_to_human` | summary, context | creates a support ticket | write |\n\n### Success and failure contracts\n\n| Tool | On success | On failure |\n| --- | --- | --- |\n| `search_help_center` | `results` containing policy identifiers, titles, snippets, and retrieval scores. | `invalid_argument` for an empty or whitespace-only query; execution exception if retrieval fails. |\n| `get_policy` | `policy_id`, `title`, `audience`, and the full `body` of the requested policy. | `not_found` for an unknown policy identifier. |\n| `search_products` | `products` and `count`, filtered and sorted by price, then product identifier. Each product includes its identifier, store identifier, title, and price. The result limit is clamped to 1 through 25. No matches yields an empty list and count zero. | `invalid_argument` for an empty query or a nonpositive price ceiling; `not_found` for an unknown store. |\n| `get_order` | An authorized `order` record, including dates, status, store name, and refund eligibility. | `not_found` for an unknown order; `permission_denied` for an order outside the caller's scope. |\n| `list_my_orders` | `orders` and `count` for the shopper's own orders or the merchant's store, newest first, with at most 20 records. No orders yields an empty list and count zero. | `invalid_argument` for a support caller; execution exception if the database query fails. |\n| `find_order` | Up to five fuzzy product-name matches in `orders`, scoped to the shopper, merchant store, or authorized support caller. No matches yields an empty list. | Execution exception if search or database access fails. |\n| `issue_refund` | `refund_id`, `order_id`, `amount_usd`, and `status`. Status is `auto_approved` at or below the threshold and `queued_for_approval` above it. | `invalid_argument` for a nonpositive amount or an amount above the order total; `not_found` for an unknown order; `permission_denied` for an unauthorized caller; `not_eligible` for an ineligible order; `paused` when refunds are disabled. |\n| `cancel_order` | `order_id` and `status: cancelled` after updating an authorized order whose current status is `placed`. | `not_found` for an unknown order; `permission_denied` for an unauthorized caller; `not_eligible` when the order is no longer `placed`; `paused` when cancellations are disabled. |\n| `escalate_to_human` | `ticket_id` and `sla_hours` after creating the support ticket. | Execution exception if ticket creation fails. |\n\n## 5. Escalation policy\n\nThe following cases always go to a human:\n\n- **ESC-1.** Refunds above the threshold; the tool queues the refund, and the agent explains the result.\n- **ESC-2.** Account changes of any kind.\n- **ESC-3.** Disputes and requests the agent cannot resolve from the help center and the\n  order record.\n- **ESC-4.** Any case where the agent is unsure whether policy allows an action.\n\n## 6. Other response requirements\n\nRequirements that do not fit in the sections above, including tone and style guidelines.\n\n- **RESP-1.** Cite the policy identifier for every claim derived from a policy document.\n- **RESP-2.** Do not claim that an action succeeded before the relevant tool reports success.\n- **RESP-3.** State when required information is missing or inconsistent, rather than inventing a value.\n- **RESP-4.** Explain refusals and escalations without revealing inaccessible order or user information.\n- **RESP-5.** Use direct and respectful language that explains the relevant decision.\n";

  const rv = tab === "run" ? reviews[id] : null;
  if (rv) node.append(el("span", rv.confirmed_failure ? "bad" : "good", rv.confirmed_failure ? "✗" : "✓"));
  if (hasNotes(id)) node.append(el("span", "", rv ? " ✎" : "✎"));
}
function setList(keep) {
  if (DOC_TABS.includes(tab)) return;
  document.querySelectorAll("#group .finalonly").forEach((o) => { o.hidden = !FINALTABS.includes(tab); o.disabled = !FINALTABS.includes(tab); });
  if (!FINALTABS.includes(tab) && ["review", "monitoring"].includes($("group").value)) $("group").value = "all";
  const g = $("group").value;
  const cur = keep === true && list[i] ? list[i].id : null;
  ALL = tab === "final" || tab === "frun" ? FINAL : PILOT;
  list = g === "all" ? ALL.slice() : ["review", "monitoring"].includes(g) ? ALL.filter((s) => (s.sets || []).includes(g)) : ALL.filter((s) => s.scenario_group === g);
  const side = $("side"); side.replaceChildren();
  list.forEach((s, n) => {
    const b = el("button", "item"); b.dataset.id = s.id; b.type = "button";
    b.append(el("span", "nid", s.id), el("span", "nint", pretty(s.tuple.intent)));
    const m = el("span", "nmark"); setMark(m, s.id); b.append(m);
    b.onclick = () => { i = n; render(); };
    side.append(b);
  });
  i = cur ? Math.max(0, list.findIndex((s) => s.id === cur)) : 0;
  render();
}
$("group").onchange = () => setList();
$("prev").onclick = () => { if (i > 0) { i--; render(); } };
$("next").onclick = () => { if (i < list.length - 1) { i++; render(); } };
document.addEventListener("keydown", (ev) => {
  if (DOC_TABS.includes(tab) || ev.target.tagName === "SELECT" || ev.target.tagName === "TEXTAREA") return;
  if (ev.key === "ArrowLeft") $("prev").click();
  if (ev.key === "ArrowRight") $("next").click();
});
setTab(tab);
loadFromFile();
</script>
</body>
