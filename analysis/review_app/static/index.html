<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwheel trace review</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">Cartwheel <span>trace review</span></div>
  <nav id="tabs" role="tablist" aria-label="Views"></nav>
  <div id="scope" class="scope" hidden></div>
  <div id="savestate" class="savestate" role="status" aria-live="polite">loading…</div>
  <div class="spacer"></div>
  <button id="btn-spec" class="btn">View spec</button>
</header>
<div id="app">
  <aside id="rail" aria-label="Sessions">
    <div class="rail-search"><input id="q" type="search" placeholder="Search scenario, role, message text  ( / )" autocomplete="off" aria-label="Search sessions"></div>
    <div class="rail-batch">
      <label>Show <select id="batch" aria-label="Review batch"><option value="all">all</option></select></label>
      <label>Sort <select id="sort" aria-label="Sort sessions" title="completion lists unreviewed sessions first"><option value="id">id</option><option value="role">role</option><option value="completion">completion</option></select></label>
    </div>
    <div id="rail-label" class="rail-batch rail-label" hidden>
      <label>Mode <select id="lmode" aria-label="Failure mode to judge"></select></label>
      <label>Draft <select id="ldraft" aria-label="Filter by draft"><option value="all">all</option><option value="present">present</option><option value="unsure">unsure</option><option value="absent">absent</option></select></label>
      <label>Mine <select id="ljudged" aria-label="Filter by your judgment"><option value="all">all</option><option value="todo">not judged</option><option value="done">judged</option></select></label>
      <label>Judge <select id="ljudge" aria-label="Filter by judge vs HW5 label"><option value="all">all</option><option value="disagree">disagreements</option><option value="agree">agree</option><option value="none">no judge run</option></select></label>
    </div>
    <div id="rail-count" class="rail-count"></div>
    <ul id="sessions" class="sessions"></ul>
  </aside>
  <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize session list (drag, or use arrow keys; double-click to reset)" tabindex="0"></div>
  <main id="main">
    <div id="sess-head"></div>
    <div id="content"></div>
  </main>
</div>
<div id="pop" class="pop" hidden>
  <textarea id="pop-text" rows="2" placeholder="What went wrong here? (free text)"></textarea>
  <div class="pop-hint">Enter saves · Shift+Enter newline · Esc cancels</div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="spec-overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Specification" tabindex="-1">
    <div class="modal-head"><strong>SPEC.md</strong><span class="muted small">specification preview</span>
      <div class="spacer"></div><button id="spec-close" class="btn" aria-label="Close spec">Close (Esc)</button></div>
    <div class="modal-body">
      <nav id="spec-toc" aria-label="Spec sections"></nav>
      <div id="spec-content" class="md"></div>
    </div>
  </div>
</div>
<script src="/static/md.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
